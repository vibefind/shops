<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Details | VibeFind</title>
<meta name="description" content="Explore curated fashion, home, beauty and kitchen finds at VibeFind.">
<style>
/* Base layout */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #faf6f1;
  color: #503b30;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: #fff;
  border-bottom: 1px solid #eaded4;
}
.logo {
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: bold;
  color: #503b30;
  text-decoration: none;
}
.back {
  font-size: 14px;
  color: #684b3a;
  text-decoration: none;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}
.category {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #795543;
}
.product h1 {
  font-family: Georgia, serif;
  font-size: 26px;
  line-height: 1.25;
  margin: 6px 0 10px;
}
.description {
  font-size: 15px;
  line-height: 1.55;
  margin: 0 0 14px;
}
.shop {
  display: inline-block;
  padding: 12px 22px;
  background: #684b3a;
  color: #fff;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}
.shop:hover { background: #503b30; }
.disclosure {
  font-size: 12px;
  color: #795543;
  margin-top: 14px;
}
/* Explore More Finds button */
.more-finds-btn {
  display: block;
  width: fit-content;
  margin-top: 12px;
  padding: 12px 22px;
  border: 1px solid #684b3a;
  border-radius: 8px;
  color: #684b3a;
  text-decoration: none;
  font-weight: bold;
}
.more-finds-btn:hover {
  background: #f4eee7;
}
/* Product layout */
.product {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.product.no-image {
  grid-template-columns: minmax(0, 1fr);
}
.product img {
  display: block;
  width: 100%;
  max-height: 60vh;
  max-height: 60dvh;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  background: #fff;
  border: 1px solid #eaded4;
  border-radius: 12px;
}
@media (max-width: 650px) {
  .product {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }
  .product img {
    max-height: 30vh;
    max-height: 30dvh;
  }
}
/* Related products */
.related-section {
  margin-top: 35px;
}
.related-section h2 {
  font-family: Georgia, serif;
  color: #503b30;
}
.related-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 15px;
}
.related-card {
  background: #fff;
  border: 1px solid #eaded4;
  border-radius: 12px;
  padding: 10px;
  text-decoration: none;
  color: #503b30;
}
.related-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 8px;
}
.related-card strong {
  display: block;
  font-size: 13px;
  line-height: 1.4;
}
.related-card span {
  display: block;
  font-size: 12px;
  margin-top: 8px;
  color: #795543;
}
@media (max-width: 650px) {
  .related-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="./">VibeFind.</a>
  <a class="back" href="./">← Back to Home</a>
</header>
<main class="container">
  <div id="product-area">Loading product...</div>
</main>
<script>
(async function () {
  const area = document.getElementById("product-area");
  const id = new URLSearchParams(location.search).get("id");
  if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
    area.textContent = "Product not found.";
    return;
  }
  const base = "https://heshxrukrkcsgpdjhzhe.supabase.co";
  const key = "sb_publishable_SNzkZDVCh3xTDGRTXR2_TA_hkrzX-7Q";
  function safeUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === "https:" ? url.href : null;
    } catch {
      return null;
    }
  }
  try {
    const endpoint =
      base + "/rest/v1/products?id=eq." +
      encodeURIComponent(id) +
      "&select=name,category,description,image_url,affiliate_link&limit=1";
    const response = await fetch(endpoint, {
      headers: { apikey: key }
    });
    if (!response.ok) throw new Error("Request failed");
    const products = await response.json();
    const product = products[0];
    if (!product) {
      area.textContent = "Product not found.";
      return;
    }
    document.title = product.name + " | VibeFind";
    const card = document.createElement("article");
    card.className = "product";
    const info = document.createElement("div");
    const category = document.createElement("div");
    category.className = "category";
    category.textContent = product.category || "VibeFind Find";
    const title = document.createElement("h1");
    title.textContent = product.name || "Product";
    const description = document.createElement("p");
    description.className = "description";
    description.textContent = product.description || "";
    info.append(category, title, description);
    const affiliateUrl = safeUrl(product.affiliate_link);
    if (affiliateUrl) {
      const button = document.createElement("a");
      button.className = "shop";
      button.href = affiliateUrl;
      button.target = "_blank";
      button.rel = "noopener noreferrer sponsored";
      button.textContent = "View on Amazon";
      info.appendChild(button);
    }
    // Explore More Finds button
    const explore = document.createElement("a");
    explore.href = "./#shop";
    explore.className = "more-finds-btn";
    explore.textContent = "Explore More Finds";
    info.appendChild(explore);
    const disclosure = document.createElement("p");
    disclosure.className = "disclosure";
    disclosure.textContent =
      "As an Amazon Associate I earn from qualifying purchases. Some links may be affiliate links.";
    info.appendChild(disclosure);
    // Only add the image column if there is a valid image
    const imageUrl = safeUrl(product.image_url);
    if (imageUrl) {
      const imageBox = document.createElement("div");
      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = product.name || "Product image";
      imageBox.appendChild(image);
      card.append(imageBox, info);
    } else {
      card.classList.add("no-image");
      card.append(info);
    }
    area.replaceChildren(card);
    // You May Also Like section (skipped if the product has no category)
    if (product.category) {
      try {
        const relatedEndpoint =
          base + "/rest/v1/products?select=id,name,category,image_url" +
          "&category=eq." + encodeURIComponent(product.category) +
          "&id=neq." + encodeURIComponent(id) +
          "&order=created_at.desc&limit=4";
        const relatedResponse = await fetch(relatedEndpoint, {
          headers: { apikey: key }
        });
        if (!relatedResponse.ok) throw new Error("Related products unavailable");
        const relatedProducts = await relatedResponse.json();
        if (relatedProducts.length) {
          const section = document.createElement("section");
          section.className = "related-section";
          const heading = document.createElement("h2");
          heading.textContent = "You May Also Like";
          const grid = document.createElement("div");
          grid.className = "related-grid";
          relatedProducts.forEach(item => {
            const link = document.createElement("a");
            link.className = "related-card";
            link.href = "product.html?id=" + encodeURIComponent(item.id);
            const itemImageUrl = safeUrl(item.image_url);
            if (itemImageUrl) {
              const image = document.createElement("img");
              image.src = itemImageUrl;
              image.alt = item.name || "VibeFind product";
              image.loading = "lazy";
              link.appendChild(image);
            }
            const name = document.createElement("strong");
            name.textContent = item.name || "Product";
            const view = document.createElement("span");
            view.textContent = "View Product";
            link.append(name, view);
            grid.appendChild(link);
          });
          section.append(heading, grid);
          area.appendChild(section);
        }
      } catch (relatedError) {
        console.warn("Related products could not load.", relatedError);
      }
    }
  } catch (error) {
    area.textContent = "Product temporarily unavailable.";
    console.error(error);
  }
})();
</script>
</body>
</html>
