<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .hidden { display: none; }
    input, textarea, select { width: 100%; padding: 8px; margin: 6px 0 12px 0; box-sizing: border-box; }
    button { padding: 10px 15px; background: #2563eb; color: white; border: none; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .error { color: #dc2626; margin-bottom: 10px; }
  </style>
</head>
<body>
  <!-- Login Section -->
  <div id="loginBox">
    <h2>Admin Login</h2>
    <div id="loginStatus" class="error"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>
  </div>
  <!-- Admin Panel Section -->
  <div id="adminBox" class="hidden">
    <h2>Add New Product</h2>
    <p id="welcome"></p>
    <div id="productStatus" class="error"></div>
    <form id="productForm">
      <label>Product Name</label>
      <input type="text" id="name" required>
<label>Category</label>
<select id="category" required>
  <option value="Fashion">Fashion</option>
  <option value="Home">Home & Decor</option>
  <option value="Kitchen">Kitchen & Coffee</option>
  <option value="Beauty">Beauty Finds</option>
  <option value="Tech">Tech & Gadgets</option>
</select>
      <label>Description</label>
      <textarea id="description" rows="4" required></textarea>
      <label>Image URL (HTTPS only)</label>
      <input type="url" id="image" placeholder="https://...">
      <label>Affiliate Link (HTTPS only)</label>
      <input type="url" id="affiliate" placeholder="https://..." required>
      <button type="submit" id="saveBtn">Save Product</button>
    </form>
    <button id="logoutBtn" style="margin-top: 20px; background: #64748b;">Sign Out</button>
  </div>
  <script>
    // STEP 1: CONFIGURATION
    const SUPABASE_URL = "https://heshxrukrkcsgpdjhzhe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SNzkZDVCh3xTDGRTXR2_TA_hkrzX-7Q";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const loginBox = document.getElementById("loginBox");
    const adminBox = document.getElementById("adminBox");
    const loginStatus = document.getElementById("loginStatus");
    const productStatus = document.getElementById("productStatus");
    async function checkAdmin() {
      const { data: userData, error: authError } = await db.auth.getUser();
      if (authError || !userData.user) {
        adminBox.classList.add("hidden");
        loginBox.classList.remove("hidden");
        return;
      }
      const { data, error } = await db
        .from("admin_users")
        .select("user_id")
        .eq("user_id", userData.user.id)
        .maybeSingle();
      if (error || !data) {
        adminBox.classList.add("hidden");
        loginBox.classList.remove("hidden");
        loginStatus.textContent = "This account does not have admin access.";
        await db.auth.signOut();
        return;
      }
      loginStatus.textContent = "";
      loginBox.classList.add("hidden");
      adminBox.classList.remove("hidden");
      document.getElementById("welcome").textContent = "Signed in as " + userData.user.email;
    }
    // Check login state on page load
    checkAdmin();
   document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!db) {
        loginStatus.textContent = "Supabase connection is not ready.";
        return;
      }
      const button = document.getElementById("loginBtn");
      button.disabled = true;
      loginStatus.textContent = "Signing in...";
      try {
        const { error } = await db.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });
        if (error) throw error;
        document.getElementById("password").value = "";
        await checkAdmin();
      } catch (error) {
        loginStatus.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await db.auth.signOut();
      window.location.reload();
    });
    document.getElementById("productForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("saveBtn");
      button.disabled = true;
      productStatus.textContent = "Saving...";    
      const name = document.getElementById("name").value.trim();
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value.trim();
      const image = document.getElementById("image").value.trim();
      const affiliate = document.getElementById("affiliate").value.trim();   
      try {
        const validHttps = (value) => new URL(value).protocol === "https:";
        if (!validHttps(affiliate) || (image && !validHttps(image))) {
          throw new Error("Use valid HTTPS links.");
        }    
      const { error } = await db.from("products").insert({
          name,
          category,
          description,
          image_url: image || null,
          affiliate_link: affiliate
        });   
        if (error) throw error;      
        productStatus.style.color = "#16a34a";
        productStatus.textContent = "Product saved successfully!";
        document.getElementById("productForm").reset();
      } catch (error) {
        productStatus.style.color = "#dc2626";
        productStatus.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
